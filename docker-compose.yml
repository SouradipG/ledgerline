services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 2s
      retries: 15

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
